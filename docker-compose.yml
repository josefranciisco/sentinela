
services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinela-postgres
    environment:
      POSTGRES_DB: sentinela
      POSTGRES_USER: sentinela
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinela123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinela"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinela-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinela-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-sentinela123} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinela-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sentinela-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sentinela}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sentinela123}
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinela-network
    restart: unless-stopped

  sentinela-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: final
    container_name: sentinela-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SentinelaDb: "Host=postgres;Port=5432;Database=sentinela;Username=sentinela;Password=${DB_PASSWORD:-sentinela123}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-sentinela123}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-sentinela}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-sentinela123}
      Jwt__SecretKey: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      Jwt__Secret: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      Jwt__Issuer: Sentinela
      Jwt__Audience: Sentinela
      Cors__Origins__0: http://localhost:3000
      Cors__Origins__1: http://localhost:5173
      Cors__Origins__2: http://192.168.0.116:3000
      Monitoramento__BaseUrl: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
       - "5002:8080"
    volumes:
      - api-storage:/app/Storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sentinela-network
    restart: unless-stopped

  sentinela-identity:
    build:
      context: .
      dockerfile: docker/identity/Dockerfile
      target: final
    container_name: sentinela-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=sentinela;Username=sentinela;Password=${DB_PASSWORD:-sentinela123}"
      ConnectionStrings__SentinelaDb: "Host=postgres;Port=5432;Database=sentinela;Username=sentinela;Password=${DB_PASSWORD:-sentinela123}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-sentinela123}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-sentinela}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-sentinela123}
      Jwt__Secret: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      Jwt__Issuer: Sentinela
      Jwt__Audience: Sentinela
      Sso__Enabled: ${SSO_ENABLED:-false}
      Sso__FrontendBaseUrl: ${SSO_FRONTEND_URL:-http://localhost:3000}
      Sso__Google__ClientId: ${SSO_GOOGLE_CLIENT_ID:-}
      Sso__Google__ClientSecret: ${SSO_GOOGLE_CLIENT_SECRET:-}
      Sso__Microsoft__ClientId: ${SSO_MICROSOFT_CLIENT_ID:-}
      Sso__Microsoft__ClientSecret: ${SSO_MICROSOFT_CLIENT_SECRET:-}
      Cors__Origins__0: http://localhost:3000
      Cors__Origins__1: http://localhost:5173
      Cors__Origins__2: http://192.168.0.116:3000
    ports:
       - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinela-network
    restart: unless-stopped

  sentinela-alert-engine:
    build:
      context: .
      dockerfile: docker/alert-engine/Dockerfile
      target: final
    container_name: sentinela-alert-engine
    environment:
      ConnectionStrings__SentinelaDb: "Host=postgres;Port=5432;Database=sentinela;Username=sentinela;Password=${DB_PASSWORD:-sentinela123}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-sentinela123}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-sentinela}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-sentinela123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sentinela-network
    restart: unless-stopped

  sentinela-automation:
    build:
      context: .
      dockerfile: docker/automation/Dockerfile
      target: final
    container_name: sentinela-automation
    environment:
      ConnectionStrings__SentinelaDb: "Host=postgres;Port=5432;Database=sentinela;Username=sentinela;Password=${DB_PASSWORD:-sentinela123}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-sentinela123}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-sentinela}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-sentinela123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sentinela-network
    restart: unless-stopped

  sentinela-correlation:
    build:
      context: .
      dockerfile: docker/correlation/Dockerfile
      target: final
    container_name: sentinela-correlation
    environment:
      ConnectionStrings__SentinelaDb: "Host=postgres;Port=5432;Database=sentinela;Username=sentinela;Password=${DB_PASSWORD:-sentinela123}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-sentinela123}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-sentinela}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-sentinela123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sentinela-network
    restart: unless-stopped

  sentinela-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: sentinela-web
    environment:
      VITE_API_URL: http://localhost:5001
      VITE_SIGNALR_URL: http://localhost:5001/hubs
    ports:
      - "3000:80"
    depends_on:
      - sentinela-api
    networks:
      - sentinela-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sentinela-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - sentinela-api
      - sentinela-identity
      - sentinela-web
    networks:
      - sentinela-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinela-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sentinela-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sentinela-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - sentinela-network
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: sentinela-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-admin}
    volumes:
      - seq-data:/data
    ports:
      - "5341:80"
    networks:
      - sentinela-network
    restart: unless-stopped

  # Túnel HTTPS público para a API/Identity (login da Vercel).
  # A URL sai nos logs: docker compose logs -f cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sentinela-cloudflared
    command: tunnel --no-autoupdate --url http://sentinela-web:80
    depends_on:
      - sentinela-web
    networks:
      - sentinela-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  seq-data:
  api-storage:

networks:
  sentinela-network:
    driver: bridge
    name: sentinela-network
